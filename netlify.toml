# Static Astro build. No environment secrets.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#auto"

# Apex is the canonical host. GoDaddy keeps DNS; these redirects cover www.
[[redirects]]
  from = "https://www.taypfoundation.com/*"
  to = "https://taypfoundation.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.taypfoundation.com/*"
  to = "https://taypfoundation.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://taypfoundation.com/*"
  to = "https://taypfoundation.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # The two sha256 sources are the JSON-LD blocks (organization, and organization plus the Classic).
    # Page scripts are external files under /_astro/. If structured data changes, rebuild and refresh these hashes.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self' 'sha256-jT/MkmBOaGOOCT8AXw0CdLkSPfNsBFDRbCAceQNAvKc=' 'sha256-VqOXq3VgUiAP10338W6si06Z9Vw13vqNFiOPxDKAM90='; upgrade-insecure-requests"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
